[project]
name = "procmem2skills"
version = "0.1.0"
description = "Skills retrieval pipeline for ProcMem2Skills: retrieve, filter, and rank ~80K agent skills from ClawdHub"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "aiohttp>=3.9",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "torch>=2.2",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "datasets>=2.18",
    "click>=8.1",
    "rich>=13.7",
    "jsonlines>=4.0",
    "anthropic>=0.40",
    "pydantic>=2.5",
    "scipy>=1.11",
    "tiktoken>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.pytest.ini_options]
pythonpath = ["skills retrieval/src"]
testpaths = ["skills retrieval/tests"]

[project.scripts]
pm2s-scrape = "src.scraper.cli:main"
pm2s-filter = "src.filter.cli:main"
pm2s-index = "src.parser.cli:main"
pm2s-retrieve = "src.retrieval.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
